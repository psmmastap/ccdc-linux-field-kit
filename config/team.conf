# Team-specific defaults, sourced by the menus. Keep it POSIX-shell parseable.
# Fill in on competition day. Values already set in the environment win.
# Every value is optional; menus fall back to safe defaults.

: "${TEAM_NUMBER:=1}"
: "${EVIDENCE_DIR:=/root/evidence}"
: "${BACKUP_DIR:=/root/backups}"
: "${ADMIN_SOURCE:=192.168.0.0/16}"
export TEAM_NUMBER EVIDENCE_DIR BACKUP_DIR ADMIN_SOURCE
